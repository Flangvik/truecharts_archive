# Build app_versions.json after chart updates
# Run when new version folders are pushed, or trigger manually
name: Build Catalog

on:
  push:
    branches: [main]
    paths:
      - 'stable/**'
      - 'incubator/**'
      - 'system/**'
  workflow_dispatch:

jobs:
  build-app-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push commits
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run build_app_versions.py
        run: python3 build_app_versions.py
        working-directory: ${{ github.workspace }}

      - name: Run build_catalog.py
        run: python3 build_catalog.py
        working-directory: ${{ github.workspace }}

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push catalog updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stable/*/app_versions.json incubator/*/app_versions.json system/*/app_versions.json catalog.json 2>/dev/null || true
          git status
          git commit -m "chore: update app_versions.json and catalog.json"
          git push
